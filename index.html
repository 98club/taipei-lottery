<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台北六本木｜統一發票開獎</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eeece6;font-family:Arial,"Noto Sans TC",sans-serif;padding:20px}
.ticket{background:#fff;width:100%;max-width:420px;border-radius:15px;border-top:12px solid #08755d;padding:32px 24px;text-align:center;box-shadow:0 10px 35px #0002}
h1{font-size:30px;margin:10px 0}
.sub{font-size:14px;color:#555}
.number{font-size:26px;font-weight:bold;margin:26px 0;padding:18px 0;border-top:1px dashed #999;border-bottom:1px dashed #999}
button{background:#08755d;color:white;border:0;border-radius:9px;padding:17px;width:100%;font-size:20px;font-weight:bold;cursor:pointer}
.seal{width:175px;height:175px;border:4px solid #b6382b;border-radius:50%;color:#b6382b;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px auto;transform:rotate(-8deg)}
.seal strong{font-size:40px}
.seal span{font-size:17px}
.prize{font-size:22px;font-weight:bold}
.message{line-height:1.9}
.footer{font-size:12px;color:#777;margin-top:30px}
.hidden{display:none}
</style>
</head>
<body>
<main class="ticket">
<h1>台北六本木</h1>
<div class="sub">統一發票 特別開獎所</div>
<div class="number">TW-97989900</div>
<section id="start">
<p class="message">感謝在台灣相遇的每一天。<br>準備好確認你的幸運了嗎？</p>
<button onclick="reveal()">立即開獎 🎁</button>
</section>
<section id="result" class="hidden">
<div class="seal"><strong id="status"></strong><span id="subtitle"></span></div>
<div class="prize" id="prize"></div>
<p class="message" id="message"></p>
</section>
<div class="footer">回憶恕不退換・友情永久有效<br>中島夫婦 敬上</div>
</main>
<script>
function reveal(){
const win=new URLSearchParams(location.search).get('ticket')==='win';
document.getElementById('start').classList.add('hidden');
document.getElementById('result').classList.remove('hidden');
document.getElementById('status').textContent=win?'中獎':'未中獎';
document.getElementById('subtitle').textContent=win?'恭喜恭喜':'銘謝惠顧';
document.getElementById('prize').textContent=win?'🎁 恭喜你中獎啦！':'友情無價 ❤️';
document.getElementById('message').innerHTML=win?'我們準備了一份精美禮物要送給你！':'這次沒有中獎，但在台灣認識你們，就是最大的獎！<br>下次在日本一起乾杯吧！';
}
</script>
</body>
</html>
